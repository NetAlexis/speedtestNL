plugins {
    id 'com.android.application'
}

android {
    compileSdk 36
    namespace 'com.netlife.speedtestnl'

    defaultConfig {
        applicationId "com.netlife.speedtestnl"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // GeckoView bundles native libraries. Generate one APK per Android ABI so
    // each device downloads only the engine it needs.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'org.mozilla.geckoview:geckoview:152.0.20260713164047'
}
