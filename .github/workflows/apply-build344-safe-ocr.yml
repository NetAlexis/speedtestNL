name: Apply Build 344 Safe OCR

on:
  push:
    branches:
      - agent/build342-from-build340
    paths:
      - .ci/build344-safe-ocr.trigger

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper files
        uses: actions/checkout@v4
        with:
          ref: agent/build342-from-build340
          path: helper

      - name: Checkout Build 344 branch
        uses: actions/checkout@v4
        with:
          ref: agent/build344-build340-safe-ocr
          fetch-depth: 0
          path: target

      - name: Verify and apply safe OCR patch
        run: |
          cp helper/.ci/build344-safe-ocr.patch /tmp/build344-safe-ocr.patch
          cd target
          git apply --check /tmp/build344-safe-ocr.patch
          git apply /tmp/build344-safe-ocr.patch

      - name: Commit application changes
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/java/com/netlife/speedtestnl/NperfBrowserAutomationService.java
          git commit -m "Restore Build 340 tolerance and add independent nPerf OCR"
          git push origin HEAD:agent/build344-build340-safe-ocr

  report:
    runs-on: ubuntu-latest
    needs: apply
    if: always()
    steps:
      - name: Report patch result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.apply.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Build 344 safe OCR patch ${RESULT} - run ${{ github.run_id }}" \
            --body "Build 340 tolerance and independent OCR patch result: ${RESULT}. Run: ${RUN_URL}"
