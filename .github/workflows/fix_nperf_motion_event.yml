name: Fix nPerf MotionEvent

on:
  push:
    branches:
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Apply MotionEvent fix
        run: python scripts/fix_nperf_motion_event.py

      - name: Verify and remove temporary files
        run: |
          git diff --check
          rm scripts/fix_nperf_motion_event.py
          rm .github/workflows/fix_nperf_motion_event.yml
          git diff --check

      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix nPerf native MotionEvent construction"
          git push origin HEAD:agent/stabilize-speedtest-nperf
