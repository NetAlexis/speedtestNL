name: Apply nPerf Controller Integration

on:
  push:
    branches:
      - agent/stabilize-speedtest-nperf
    paths:
      - scripts/integrate_nperf_controller.py
      - .github/workflows/apply-nperf-controller.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Apply guarded integration
        run: python scripts/integrate_nperf_controller.py

      - name: Verify and clean temporary files
        run: |
          git diff --check
          rm scripts/integrate_nperf_controller.py
          rm .github/workflows/apply-nperf-controller.yml
          git diff --check

      - name: Commit integrated controller
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java \
                  scripts/integrate_nperf_controller.py \
                  .github/workflows/apply-nperf-controller.yml
          git commit -m "Integrate deterministic nPerf automation without reload loops"
          git push origin HEAD:agent/stabilize-speedtest-nperf
