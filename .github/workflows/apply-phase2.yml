name: Apply Phase 2 Flow

on:
  push:
    branches:
      - agent/stabilize-speedtest-nperf
    paths:
      - scripts/apply_phase2.py
      - .github/workflows/apply-phase2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply, verify and commit guarded migration
        shell: bash
        run: |
          # The legacy string also appears in the valid final nPerf save path.
          # Remove only that over-broad diagnostic from the temporary runner copy.
          sed -i '/handler.postDelayed(MainActivity.this::saveTxt, 2000);/d' scripts/apply_phase2.py

          set +e
          python scripts/apply_phase2.py > /tmp/phase2.log 2>&1
          status=$?
          set -e
          cat /tmp/phase2.log
          git checkout -- scripts/apply_phase2.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp /tmp/phase2.log scripts/phase2-error.log
            git add scripts/phase2-error.log
            git commit -m "Record phase 2 migration failure [skip ci]" || true
            git push origin HEAD:agent/stabilize-speedtest-nperf
            exit "$status"
          fi

          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/netlife/speedtestnl/MainActivity.java"

          rm -f scripts/phase2-error.log
          git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java scripts/phase2-error.log
          git commit -m "Stabilize Speedtest to nPerf flow [skip ci]"
          git push origin HEAD:agent/stabilize-speedtest-nperf
