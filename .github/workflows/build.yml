name: Apply nPerf Native Touch Fix

on:
  push:
    branches:
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Apply guarded correction
        run: python scripts/apply_nperf_native_touch.py

      - name: Verify and restore temporary files
        run: |
          git diff --check
          git show origin/agent/restore-build-baseline:.github/workflows/build.yml > .github/workflows/build.yml
          printf '# speedtestNL\n' > README.md
          rm scripts/apply_nperf_native_touch.py
          git diff --check

      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java .github/workflows/build.yml README.md scripts/apply_nperf_native_touch.py
          git commit -m "Handle nPerf consent with native Android touch"
          git push origin HEAD:agent/stabilize-speedtest-nperf
