name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SpeedtestNL-build-341.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-build-341
          path: SpeedtestNL-build-341.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish build 341 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view build-341 >/dev/null 2>&1; then
            gh release upload build-341 SpeedtestNL-build-341.apk --clobber
          else
            gh release create build-341 SpeedtestNL-build-341.apk \
              --target "$GITHUB_SHA" \
              --title "SpeedtestNL build 341" \
              --notes "Build 341: corrección de lectura de descarga/subida en nPerf, eliminación de jitter de nPerf y mejoras de reintento/restablecimiento."
          fi
