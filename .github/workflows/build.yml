name: Apply nPerf Result Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Normalize inherited comment marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/harden_nperf_results.py')
          text = path.read_text(encoding='utf-8')
          old = "helper_marker = '    // ── Polling nperf cada 3s ─────────────────────────────────────────────\\n'"
          new = "helper_marker = '// ── Polling nperf cada 3s ─────────────────────────────────────────────\\n'"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one helper marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply guarded correction
        run: python scripts/harden_nperf_results.py

      - name: Verify and restore temporary files
        run: |
          git diff --check
          git show origin/agent/restore-build-baseline:.github/workflows/build.yml > .github/workflows/build.yml
          rm scripts/harden_nperf_results.py
          git diff --check

      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java .github/workflows/build.yml scripts/harden_nperf_results.py
          git commit -m "Harden nPerf result detection and extraction"
          git push origin HEAD:agent/stabilize-speedtest-nperf
