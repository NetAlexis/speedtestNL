name: Android Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/custom-tab-nperf-automation
          fetch-depth: 0

      - name: Apply guarded visual nPerf OCR integration
        run: |
          if [ -f scripts/apply_nperf_visual_ocr.py ]; then
            python scripts/apply_nperf_visual_ocr.py
            rm scripts/apply_nperf_visual_ocr.py
            git diff --check
            grep -q 'android:canTakeScreenshot="true"' app/src/main/res/xml/nperf_accessibility_service.xml
            grep -q 'com.google.mlkit:text-recognition:16.0.1' app/build.gradle
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Read completed nPerf metrics from visual result panel"
            git push origin HEAD:agent/custom-tab-nperf-automation
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-CustomTab-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-CustomTab-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
