name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build-error.log

      - name: Publish failure details
        if: steps.android_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo 'El build Android falló.'
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -n 180 build-error.log
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "CI build 341 failed - run ${GITHUB_RUN_ID}" \
            --body-file issue-body.md

      - name: Stop after failed build
        if: steps.android_build.outcome == 'failure'
        run: exit 1

      - name: Prepare APK
        if: steps.android_build.outcome == 'success'
        run: cp app/build/outputs/apk/debug/app-debug.apk SpeedtestNL-build-341.apk

      - name: Upload APK artifact
        if: steps.android_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-build-341
          path: SpeedtestNL-build-341.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish build 341 release
        if: steps.android_build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view build-341 >/dev/null 2>&1; then
            gh release upload build-341 SpeedtestNL-build-341.apk --clobber
          else
            gh release create build-341 SpeedtestNL-build-341.apk \
              --target "$GITHUB_SHA" \
              --title "SpeedtestNL build 341" \
              --notes "Build 341: corrección de lectura de descarga/subida en nPerf, eliminación de jitter de nPerf y mejoras de reintento/restablecimiento."
          fi
