name: Android Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply GeckoView network recovery
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/agent/embed-nperf-geckoview') ||
          (github.event_name == 'pull_request' && github.head_ref == 'agent/embed-nperf-geckoview')
        run: |
          git fetch origin agent/embed-nperf-geckoview
          git checkout -B agent/embed-nperf-geckoview origin/agent/embed-nperf-geckoview
          if grep -q 'versionName "1.3-gecko-network"' app/build.gradle; then
            echo "GeckoView network recovery already applied"
          else
            sed -i 's/"Reintentar únicamente nPerf"/"Puede reintentar únicamente nPerf"/' \
              scripts/apply_gecko_network_recovery.py
            python3 scripts/apply_gecko_network_recovery.py
            node --check app/src/main/assets/nperf_automation/frame_controller.js
            git diff --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java \
                    app/src/main/java/com/netlife/speedtestnl/NperfGeckoActivity.java \
                    app/src/main/assets/nperf_automation/frame_controller.js \
                    app/src/main/assets/nperf_automation/manifest.json \
                    app/build.gradle
            git commit -m "Recover nPerf data-channel failures in GeckoView"
            git push origin HEAD:agent/embed-nperf-geckoview
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-GeckoView-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-GeckoView-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
