name: Android Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/custom-tab-nperf-automation
          fetch-depth: 0

      - name: Apply guarded verified metric extraction
        run: |
          python3 scripts/patch_verified_metrics.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode 6', 'versionCode 7')
          text = text.replace('versionName "1.6-custom-tab-verified"',
                              'versionName "1.7-custom-tab-metrics"')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java
          git add app/src/main/java/com/netlife/speedtestnl/NperfBrowserAutomationService.java
          git add app/build.gradle
          git commit -m "Validate Speedtest and nPerf metrics before saving"
          git push origin HEAD:agent/custom-tab-nperf-automation

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-CustomTab-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-CustomTab-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
