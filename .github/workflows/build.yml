name: Android Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply nPerf embedded-frame fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/embed-nperf-geckoview'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          manifest_path = Path('app/src/main/assets/nperf_automation/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('version') == '1.1.0':
              print('Frame fix already applied')
              raise SystemExit(0)

          manifest['version'] = '1.1.0'
          script = manifest['content_scripts'][0]
          script['matches'] = [
              'https://www.nperf.com/*',
              'https://*.nperf.com/*',
              'https://*.nperf.net/*',
              'http://*.nperf.net/*',
          ]
          script['all_frames'] = True
          script['match_about_blank'] = True
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          path = Path('app/src/main/assets/nperf_automation/content.js')
          text = path.read_text()

          declaration = '  let consecutiveNoControl = 0;\n'
          replacement = declaration + '  let childActivityAt = 0;\n  const BRIDGE_KEY = "__speedtestNlNperfBridge";\n  const isTopFrame = window.top === window;\n'
          assert declaration in text
          text = text.replace(declaration, replacement, 1)

          old_send = '''  const send = message => {
    const payload = Object.assign({
      href: location.href,
      title: document.title,
      timestamp: Date.now(),
      viewportWidth: window.innerWidth || 1,
      viewportHeight: window.innerHeight || 1
    }, message);
    try {
      browser.runtime.sendNativeMessage(NATIVE_APP, payload).catch(() => {});
    } catch (_) {}
  };
'''
          new_send = '''  const nativeSend = payload => {
    try {
      browser.runtime.sendNativeMessage(NATIVE_APP, payload).catch(() => {});
    } catch (_) {}
  };

  const send = message => {
    const payload = Object.assign({
      href: location.href,
      frameHref: location.href,
      title: document.title,
      timestamp: Date.now(),
      viewportWidth: window.innerWidth || 1,
      viewportHeight: window.innerHeight || 1,
      frameDepth: 0,
      topFrame: isTopFrame
    }, message);
    if (isTopFrame) {
      nativeSend(payload);
      return;
    }
    try {
      window.parent.postMessage({ [BRIDGE_KEY]: true, payload }, "*");
    } catch (_) {
      nativeSend(payload);
    }
  };

  const findSourceFrame = source => {
    for (const frame of document.querySelectorAll("iframe,frame")) {
      try {
        if (frame.contentWindow === source) return frame;
      } catch (_) {}
    }
    return null;
  };

  window.addEventListener("message", event => {
    const bridge = event && event.data;
    if (!bridge || bridge[BRIDGE_KEY] !== true || !bridge.payload) return;

    const payload = Object.assign({}, bridge.payload);
    const frame = findSourceFrame(event.source);
    if (frame && payload.type === "tap") {
      const rect = frame.getBoundingClientRect();
      const childWidth = Number(payload.viewportWidth) || rect.width || 1;
      const childHeight = Number(payload.viewportHeight) || rect.height || 1;
      payload.x = rect.left + Number(payload.x || 0) * rect.width / childWidth;
      payload.y = rect.top + Number(payload.y || 0) * rect.height / childHeight;
      payload.width = Number(payload.width || 0) * rect.width / childWidth;
      payload.height = Number(payload.height || 0) * rect.height / childHeight;
    }

    payload.frameDepth = Number(payload.frameDepth || 0) + 1;
    payload.viewportWidth = window.innerWidth || 1;
    payload.viewportHeight = window.innerHeight || 1;

    if (["state", "tap", "metrics", "complete", "error"].includes(payload.type)) {
      childActivityAt = Date.now();
    }

    if (isTopFrame) {
      payload.frameHref = payload.frameHref || payload.href;
      payload.href = location.href;
      payload.topFrame = false;
      nativeSend(payload);
    } else {
      try {
        window.parent.postMessage({ [BRIDGE_KEY]: true, payload }, "*");
      } catch (_) {
        nativeSend(payload);
      }
    }
  }, false);
'''
          assert old_send in text
          text = text.replace(old_send, new_send, 1)

          start_line = '    const start = findStart();\n'
          assert start_line in text
          text = text.replace(start_line, start_line + '    const canvas = findCanvas();\n', 1)

          old_initializing = '''    if (initializing && !start && !hasAnyMetric) {
      consecutiveNoControl = 0;
      setState("initializing", "Inicializando motor y servidor nPerf");
      return;
    }
'''
          new_initializing = '''    if (initializing && !start && !canvas && !hasAnyMetric) {
      consecutiveNoControl = 0;
      if (!isTopFrame || Date.now() - childActivityAt > 5000) {
        setState("initializing", "Inicializando motor y servidor nPerf");
      }
      return;
    }
'''
          assert old_initializing in text
          text = text.replace(old_initializing, new_initializing, 1)

          old_start = '''    if (start && !hasAnyMetric) {
      consecutiveNoControl = 0;
      if (startAttempts < 8) {
        startAttempts += 1;
        setState("ready", `Activando Iniciar test (${startAttempts}/8)`, true);
        activate(start, "start");
      } else {
        send({
          type: "error",
          code: "START_NOT_RESPONDING",
          detail: "El botón Iniciar test permaneció visible después de 8 activaciones"
        });
      }
      return;
    }
'''
          new_start = '''    if ((start || canvas) && !hasAnyMetric) {
      consecutiveNoControl = 0;
      if (startAttempts < 12) {
        const target = start || canvas;
        const role = start ? "start" : "canvas";
        if (activate(target, role)) {
          startAttempts += 1;
          setState("ready",
            `Activando Iniciar test en marco nPerf (${startAttempts}/12, ${role})`, true);
        }
      } else {
        send({
          type: "error",
          code: "START_NOT_RESPONDING",
          detail: "El control Iniciar test permaneció visible después de 12 activaciones"
        });
      }
      return;
    }
'''
          assert old_start in text
          text = text.replace(old_start, new_start, 1)

          old_canvas = '''    const canvas = findCanvas();
    if (canvas && startAttempts < 8 && elapsed > 4000) {
      startAttempts += 1;
      setState("canvas", `Activando medidor nPerf (${startAttempts}/8)`, true);
      activate(canvas, "canvas");
      return;
    }

'''
          assert old_canvas in text
          text = text.replace(old_canvas, '', 1)

          old_wait = '    setState("waiting", "Esperando que nPerf prepare el medidor");\n'
          new_wait = '''    if (!isTopFrame || Date.now() - childActivityAt > 5000) {
      const frameCount = document.querySelectorAll("iframe,frame").length;
      setState("waiting", frameCount > 0
        ? `Buscando Iniciar test dentro de ${frameCount} marco(s) nPerf`
        : "Esperando que nPerf prepare el medidor");
    }
'''
          assert old_wait in text
          text = text.replace(old_wait, new_wait, 1)

          old_ready = '  send({ type: "extension_ready", detail: "Automatización nPerf cargada" });\n'
          new_ready = '''  send({ type: "extension_ready", detail: isTopFrame
    ? "Automatización nPerf activa en página principal"
    : "Automatización nPerf activa dentro del medidor" });
'''
          assert old_ready in text
          text = text.replace(old_ready, new_ready, 1)

          path.write_text(text)

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text()
          gradle = gradle.replace('versionCode 1', 'versionCode 2', 1)
          gradle = gradle.replace('versionName "1.0"', 'versionName "1.1-gecko-framefix"', 1)
          gradle_path.write_text(gradle)
          PY

          node --check app/src/main/assets/nperf_automation/content.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/nperf_automation/manifest.json \
                  app/src/main/assets/nperf_automation/content.js \
                  app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Fix nPerf automation inside embedded frames"
            git push origin HEAD:agent/embed-nperf-geckoview
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android API 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lintRelease --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-GeckoView-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-GeckoView-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14
