name: Fix Phase 2 Regex

on:
  push:
    branches:
      - agent/stabilize-speedtest-nperf
    paths:
      - .github/workflows/fix-phase2-regex.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Fix Java regex escape
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/netlife/speedtestnl/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          old = 'Pattern.compile("result/([\\w-]+)")'
          new = 'Pattern.compile("result/([\\\\w-]+)")'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one regex occurrence, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -F 'Pattern.compile("result/([\\w-]+)")' app/src/main/java/com/netlife/speedtestnl/MainActivity.java

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/netlife/speedtestnl/MainActivity.java
          git commit -m "Fix Speedtest result regex escaping"
          git push origin HEAD:agent/stabilize-speedtest-nperf
