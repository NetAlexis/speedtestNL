name: Apply nPerf Engine Compatibility

on:
  push:
    branches:
      - agent/stabilize-speedtest-nperf

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/stabilize-speedtest-nperf
          fetch-depth: 0

      - name: Apply guarded compatibility migration
        run: python scripts/apply_nperf_engine_compat.py

      - name: Verify and remove temporary files
        run: |
          git diff --check
          rm scripts/apply_nperf_engine_compat.py
          rm .github/workflows/apply_nperf_engine_compat.yml
          git diff --check

      - name: Commit corrected implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden nPerf engine initialization and activation"
          git push origin HEAD:agent/stabilize-speedtest-nperf
