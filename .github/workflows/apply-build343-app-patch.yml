name: Apply build 343 nPerf patch

on:
  push:
    branches:
      - agent/build342-from-build340
    paths:
      - .ci/build343-app-only.patch.gz.b64

permissions:
  contents: write
  issues: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean build 342 branch
        uses: actions/checkout@v4
        with:
          ref: agent/build343-nperf-final-screen
          fetch-depth: 0

      - name: Fetch patch source
        run: git fetch origin agent/build342-from-build340

      - name: Decode and verify app patch
        run: |
          git show origin/agent/build342-from-build340:.ci/build343-app-only.patch.gz.b64 \
            | base64 -d | gzip -d > /tmp/build343.patch
          git apply --check -p1 /tmp/build343.patch

      - name: Apply and publish app changes
        run: |
          git apply -p1 /tmp/build343.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle \
            app/src/main/java/com/netlife/speedtestnl/NperfBrowserAutomationService.java \
            app/src/main/java/com/netlife/speedtestnl/NperfScreenshotResultParser.java
          git commit -m "Detect and capture the nPerf final result screen"
          git push origin HEAD:agent/build343-nperf-final-screen

  report:
    needs: apply
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report patch result
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ needs.apply.result }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build 343 nPerf patch ${conclusion} - run ${context.runId}`,
              body: `Final-screen OCR patch result: ${conclusion}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
