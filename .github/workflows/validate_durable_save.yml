name: Validate Durable Save

on:
  push:
    branches:
      - agent/custom-tab-nperf-automation
    paths-ignore:
      - validation/durable-save-build.json

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/custom-tab-nperf-automation
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run lint
        id: lint
        continue-on-error: true
        run: ./gradlew lintRelease --stacktrace

      - name: Build release APK
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-CustomTab-2.3.1-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpeedtestNL-CustomTab-2.3.1-lint
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish validation marker
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p validation
          cat > validation/durable-save-build.json <<EOF
          {
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "head_sha": "${HEAD_SHA}",
            "lint": "${LINT_OUTCOME}",
            "assemble": "${ASSEMBLE_OUTCOME}",
            "artifact": "SpeedtestNL-CustomTab-2.3.1-release"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/durable-save-build.json
          git commit -m "Record durable-save build ${RUN_NUMBER}" || true
          git push origin HEAD:agent/custom-tab-nperf-automation

      - name: Enforce validation result
        if: steps.lint.outcome != 'success' || steps.assemble.outcome != 'success'
        run: exit 1
