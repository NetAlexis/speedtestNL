name: Apply nPerf SDK Flow

on:
  push:
    branches:
      - agent/integrate-nperf-sdk

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/integrate-nperf-sdk
          fetch-depth: 0

      - name: Apply guarded MainActivity migration
        run: python scripts/apply_nperf_sdk_flow.py

      - name: Verify and remove temporary files
        run: |
          git diff --check
          rm scripts/apply_nperf_sdk_flow.py
          rm .github/workflows/apply_nperf_sdk_flow.yml
          git diff --check

      - name: Commit native SDK flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route nPerf phase through native SDK contract"
          git push origin HEAD:agent/integrate-nperf-sdk
