name: Apply GeckoView nPerf Flow

on:
  push:
    branches:
      - agent/embed-nperf-geckoview

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GeckoView branch
        uses: actions/checkout@v4
        with:
          ref: agent/embed-nperf-geckoview
          fetch-depth: 0

      - name: Apply guarded MainActivity migration
        run: python scripts/apply_geckoview_nperf_flow.py

      - name: Verify and remove temporary files
        run: |
          git diff --check
          rm scripts/apply_geckoview_nperf_flow.py
          rm .github/workflows/apply_geckoview_nperf_flow.yml
          git diff --check

      - name: Commit GeckoView flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route nPerf through embedded GeckoView"
          git push origin HEAD:agent/embed-nperf-geckoview
