name: Fix GeckoView Lint

on:
  push:
    branches:
      - agent/embed-nperf-geckoview

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GeckoView branch
        uses: actions/checkout@v4
        with:
          ref: agent/embed-nperf-geckoview
          fetch-depth: 0

      - name: Apply guarded lint corrections
        run: python scripts/fix_geckoview_lint.py

      - name: Verify and remove temporary files
        run: |
          git diff --check
          rm scripts/fix_geckoview_lint.py
          rm .github/workflows/fix_geckoview_lint.yml
          git diff --check

      - name: Commit GeckoView lint corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix GeckoView UI-thread and back handling"
          git push origin HEAD:agent/embed-nperf-geckoview
